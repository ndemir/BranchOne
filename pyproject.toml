[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "branchone"
version = "0.3.0"
description = "Independent candidate decisions with a native multimodal Qwen backbone"
requires-python = ">=3.13,<3.14"
readme = "README.md"
dependencies = [
    "torch==2.11.0+cu128",
    "torchvision==0.26.0+cu128",
    "torchaudio==2.11.0+cu128",
    "torchcodec==0.11.0+cu128",
    "transformers==5.17.0",
    "peft==0.21.0",
    "accelerate==1.14.0",
    "flash-linear-attention==0.5.2",
    "fla-core==0.5.2",
    "safetensors==0.8.0",
    "numpy==2.5.3",
    "Pillow==12.1.1",
]

[project.optional-dependencies]
build-kernels = ["ninja", "packaging", "wheel", "setuptools", "pip"]
test = ["pytest>=8,<10"]

[project.scripts]
branchone = "branchone.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
torchcodec = { index = "pytorch-cu128" }

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
